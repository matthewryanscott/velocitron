[project]
name = "velocitron-cli"
version = "0.1.0"
description = "Console commands for validating, converting, checking, proving, generating, and drawing Velocitron nets."
readme = "README.md"
authors = [
    { name = "Matthew R. Scott" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "json5>=0.15.0",
    "velocitron-analysis",
    "velocitron-cel",
    "velocitron-codegen",
    "velocitron-dsl",
    "velocitron-engine",
    "velocitron-equiv",
    "velocitron-explain",
    "velocitron-merge",
    "velocitron-petrinet",
    "velocitron-play",
    "velocitron-play-check",
    "velocitron-runtime",
    "velocitron-skill",
    "velocitron-viz",
]

[project.optional-dependencies]
cel-cpp = ["velocitron-cel[cel-cpp]"]
cel-rust = ["velocitron-cel[cel-rust]"]

[project.scripts]
velocitron = "velocitron_cli:main"
velocitron-viz = "velocitron_cli:viz_main"

[tool.uv.sources]
velocitron-analysis = { path = "../../analysis/python", editable = false }
velocitron-cel = { path = "../../cel/python", editable = false }
velocitron-codegen = { path = "../../codegen/python", editable = false }
velocitron-dsl = { path = "../../dsl/python", editable = false }
velocitron-engine = { path = "../../engine/python", editable = false }
velocitron-equiv = { path = "../../equiv/python", editable = false }
velocitron-explain = { path = "../../explain/python", editable = false }
velocitron-merge = { path = "../../merge/python", editable = false }
velocitron-petrinet = { path = "../../petrinet/python", editable = false }
velocitron-play = { path = "../../play/python", editable = false }
velocitron-play-check = { path = "../../play-check/python", editable = false }
velocitron-runtime = { path = "../../runtime/python", editable = false }
velocitron-skill = { path = "../../skill/python", editable = false }
velocitron-viz = { path = "../../viz/python", editable = false }

[project.urls]
Homepage = "https://github.com/circuitmeridian/velocitron"
Repository = "https://github.com/circuitmeridian/velocitron"
Issues = "https://github.com/circuitmeridian/velocitron/issues"

[dependency-groups]
test = [
    "pytest>=9.0",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/velocitron_cli"]
dev-mode-exact = true

[tool.pytest.ini_options]
testpaths = ["tests"]
