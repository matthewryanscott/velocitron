[project]
name = "velocitron-cel"
version = "0.1.0"
description = "CEL compile and eval adapters for Velocitron. Does not fire nets or lower .petrinet."
readme = "README.md"
authors = [
    { name = "Matthew R. Scott" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # The bundled celpy's dependencies (src/velocitron_cel/_vendor/celpy/VENDORED.md).
    # Keep these aligned with implementations/python. google-re2 is only
    # required where it has wheels; elsewhere celpy's matches() uses this
    # package's stand-in, backed by re (ADR 0054).
    "lark>=1.2.2",
    "pendulum>=3.1.0",
    "google-re2>=1.1.20240702; platform_python_implementation == 'CPython' and python_version < '3.15' and (sys_platform == 'darwin' or sys_platform == 'win32' or (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')))",
    "google-re2>=1.1.20250722; platform_python_implementation == 'CPython' and python_version == '3.13' and (sys_platform == 'darwin' or sys_platform == 'win32' or (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')))",
    "pyrsistent>=0.20.0",
]

[project.optional-dependencies]
cel-cpp = ["cel-expr-python>=0.1.3"]
cel-rust = ["common-expression-language>=0.6.0", "typing_extensions>=4.12"]

[project.urls]
Homepage = "https://github.com/matthewryanscott/velocitron"
Repository = "https://github.com/matthewryanscott/velocitron"
Issues = "https://github.com/matthewryanscott/velocitron/issues"

[dependency-groups]
test = [
    "pytest>=9.0",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/velocitron_cel"]
dev-mode-exact = true

# celpy reads cel.lark from its package directory. A wheel includes the grammar
# and the Apache-2.0 notices so a git-subdirectory install can evaluate CEL
# without the rest of the checkout.
[tool.hatch.build.targets.wheel.force-include]
"src/velocitron_cel/_vendor/celpy/cel.lark" = "velocitron_cel/_vendor/celpy/cel.lark"
"src/velocitron_cel/_vendor/celpy/LICENSE" = "velocitron_cel/_vendor/celpy/LICENSE"
"src/velocitron_cel/_vendor/celpy/VENDORED.md" = "velocitron_cel/_vendor/celpy/VENDORED.md"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["src/velocitron_cel/_vendor"]
force-exclude = true

[tool.ruff.lint.per-file-ignores]
"src/velocitron_cel/_vendor/**/*.py" = ["F403", "F405"]
