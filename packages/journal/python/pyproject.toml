[project]
name = "velocitron-journal"
version = "0.1.0"
description = "Appends, reads, and replays Velocitron journal records. Does not fire a net or run the async runtime."
readme = "README.md"
authors = [
    { name = "Matthew R. Scott" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "velocitron-engine",
]

[tool.uv.sources]
velocitron-engine = { path = "../../engine/python", editable = false }

[project.urls]
Homepage = "https://github.com/matthewryanscott/velocitron"
Repository = "https://github.com/matthewryanscott/velocitron"
Issues = "https://github.com/matthewryanscott/velocitron/issues"

[dependency-groups]
test = [
    "pytest>=9.0",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/velocitron_journal"]
dev-mode-exact = true

[tool.pytest.ini_options]
testpaths = ["tests"]
