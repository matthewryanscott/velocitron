[package]
name = "velocitron-kernel"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "velocitron_kernel"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py312"] }
hashbrown = "0.15"
rustc-hash = "2"
rayon = "1"

[profile.release]
lto = "thin"
codegen-units = 1
