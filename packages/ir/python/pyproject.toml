[project]
name = "velocitron-ir"
version = "0.1.0"
description = "Shape-only loader for Velocitron contribution IR. Does not compile CEL or merge compositions."
readme = "README.md"
authors = [
    { name = "Matthew R. Scott" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "jsonschema>=4.26.0",
]

[project.urls]
Homepage = "https://github.com/matthewryanscott/velocitron"
Repository = "https://github.com/matthewryanscott/velocitron"
Issues = "https://github.com/matthewryanscott/velocitron/issues"

[dependency-groups]
test = [
    "pytest>=9.0",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/velocitron_ir"]
dev-mode-exact = true

# The schema copy is generated from packages/spec. A wheel includes it so a
# git-subdirectory install can validate IR without the rest of the checkout.
[tool.hatch.build.targets.wheel.force-include]
"src/velocitron_ir/schemas/petrinet-contribution-ir.schema.json" = "velocitron_ir/schemas/petrinet-contribution-ir.schema.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
