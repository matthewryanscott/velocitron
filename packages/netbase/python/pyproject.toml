[project]
name = "velocitron-netbase"
version = "0.1.0"
description = "VelocitronNet, the registration base a generated Python net extends. Re-exports the codegen digest it checks."
readme = "README.md"
authors = [
    { name = "Matthew R. Scott" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "velocitron-cel",
    "velocitron-codegen",
    "velocitron-engine",
    "velocitron-runtime",
]

[tool.uv.sources]
velocitron-cel = { path = "../../cel/python", editable = false }
velocitron-codegen = { path = "../../codegen/python", editable = false }
velocitron-engine = { path = "../../engine/python", editable = false }
velocitron-runtime = { path = "../../runtime/python", editable = false }

[project.urls]
Homepage = "https://github.com/circuitmeridian/velocitron"
Repository = "https://github.com/circuitmeridian/velocitron"
Issues = "https://github.com/circuitmeridian/velocitron/issues"

[dependency-groups]
test = [
    "pytest>=9.0",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/velocitron_netbase"]
dev-mode-exact = true

[tool.pytest.ini_options]
testpaths = ["tests"]
