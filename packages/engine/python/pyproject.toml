[project]
name = "velocitron-engine"
version = "0.1.0"
description = "Fires and advances already-built Velocitron nets. Does not bundle a CEL backend, journal storage, or a play checker."
readme = "README.md"
authors = [
    { name = "Matthew R. Scott" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyrsistent>=0.20.0",
]

[project.urls]
Homepage = "https://github.com/matthewryanscott/velocitron"
Repository = "https://github.com/matthewryanscott/velocitron"
Issues = "https://github.com/matthewryanscott/velocitron/issues"

[dependency-groups]
test = [
    "pytest>=9.0",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/velocitron_engine"]
dev-mode-exact = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# tools/engine_package.py copies these from the language implementation.
extend-exclude = [
    "src/velocitron_engine/contract.py",
    "src/velocitron_engine/engine.py",
    "src/velocitron_engine/journal.py",
    "src/velocitron_engine/outputs.py",
    "src/velocitron_engine/registry.py",
    "src/velocitron_engine/schema.py",
]
force-exclude = true

[tool.ruff.format]
exclude = [
    "src/velocitron_engine/contract.py",
    "src/velocitron_engine/engine.py",
    "src/velocitron_engine/journal.py",
    "src/velocitron_engine/outputs.py",
    "src/velocitron_engine/registry.py",
    "src/velocitron_engine/schema.py",
]
