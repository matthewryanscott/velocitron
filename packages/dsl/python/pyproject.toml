[project]
name = "velocitron-dsl"
version = "0.1.0"
description = "Lowers Velocitron .petrinet documents to contribution IR and emits canonical .petrinet text. Does not resolve IR, compile CEL, or merge compositions."
readme = "README.md"
authors = [
    { name = "Matthew R. Scott" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "antlr4-python3-runtime==4.13.2",
    "velocitron-viz",
]

[tool.uv.sources]
velocitron-viz = { path = "../../viz/python", editable = false }

[project.urls]
Homepage = "https://github.com/circuitmeridian/velocitron"
Repository = "https://github.com/circuitmeridian/velocitron"
Issues = "https://github.com/circuitmeridian/velocitron/issues"

[dependency-groups]
test = [
    "pytest>=9.0",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/velocitron_dsl"]
dev-mode-exact = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["src/velocitron_dsl/generated"]

[tool.ruff.format]
# tools/antlr.py formats the parser while generating it; the DSL copy tracks
# that tree. `tools/dsl_package.py check` guards it.
exclude = ["src/velocitron_dsl/generated/*.py"]

[tool.ruff.lint.per-file-ignores]
"src/velocitron_dsl/generated/*.py" = ["F403", "F405"]
