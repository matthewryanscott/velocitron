[project]
name = "velocitron-merge"
version = "0.1.0"
description = "Merges already-parsed Velocitron nets. Does not parse documents, compile CEL, or run the engine."
readme = "README.md"
authors = [
    { name = "Matthew R. Scott" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "velocitron-engine",
]

[tool.uv.sources]
velocitron-engine = { path = "../../engine/python", editable = false }

[project.urls]
Homepage = "https://github.com/circuitmeridian/velocitron"
Repository = "https://github.com/circuitmeridian/velocitron"
Issues = "https://github.com/circuitmeridian/velocitron/issues"

[dependency-groups]
test = [
    "pytest>=9.0",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/velocitron_merge"]
dev-mode-exact = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# tools/merge_package.py copies these from the language implementation.
extend-exclude = [
    "src/velocitron_merge/merge.py",
    "src/velocitron_merge/refine.py",
]

[tool.ruff.format]
exclude = [
    "src/velocitron_merge/merge.py",
    "src/velocitron_merge/refine.py",
]
