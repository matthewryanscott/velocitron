[project]
name = "velocitron-play-check"
version = "0.1.0"
description = "Checks a .play document against a net and steps a walkthrough. Does not parse the grammar, store a journal, or own the CLI."
readme = "README.md"
authors = [
    { name = "Matthew R. Scott" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "velocitron-analysis",
    "velocitron-cel",
    "velocitron-dsl",
    "velocitron-engine",
    "velocitron-merge",
    "velocitron-petrinet",
    "velocitron-play",
    "velocitron-viz",
]

[tool.uv.sources]
velocitron-analysis = { path = "../../analysis/python", editable = false }
velocitron-cel = { path = "../../cel/python", editable = false }
velocitron-dsl = { path = "../../dsl/python", editable = false }
velocitron-engine = { path = "../../engine/python", editable = false }
velocitron-merge = { path = "../../merge/python", editable = false }
velocitron-petrinet = { path = "../../petrinet/python", editable = false }
velocitron-play = { path = "../../play/python", editable = false }
velocitron-viz = { path = "../../viz/python", editable = false }

[project.urls]
Homepage = "https://github.com/matthewryanscott/velocitron"
Repository = "https://github.com/matthewryanscott/velocitron"
Issues = "https://github.com/matthewryanscott/velocitron/issues"

[dependency-groups]
test = [
    "pytest>=9.0",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/velocitron_play_check"]
dev-mode-exact = true

[tool.pytest.ini_options]
testpaths = ["tests"]
